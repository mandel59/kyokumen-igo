# KataGo as a human-like opponent of a chosen rank, under the app's rules, for tools/gtp/match.mjs.
#   katago gtp -config tools/gtp/katago-human.cfg -model b18c384nbt-humanv0.bin.gz \
#     -human-model b18c384nbt-humanv0.bin.gz -override-config humanSLProfile=rank_5k
# Moves are drawn from the human model's policy for that rank (rank_20k ... rank_9d); the short
# search only decides passing. KataGo's settings are documented in its example configs.

logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

# The app's rules: area scoring, positional superko, no suicide, and no dead-stone removal, so
# KataGo captures dead stones before passing.
koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = 0
friendlyPassOk = false
conservativePass = true

# Games are played out; KataGo still requires the resignation keys.
allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 20
maxVisits = 40
numSearchThreads = 1
delayMoveScale = 0.0
delayMoveMax = 0.0

humanSLProfile = rank_5k
humanSLChosenMoveProp = 1.0
humanSLChosenMoveIgnorePass = true
humanSLChosenMovePiklLambda = 100000000
humanSLRootExploreProbWeightless = 0.0
humanSLRootExploreProbWeightful = 0.0
humanSLPlaExploreProbWeightless = 0.0
humanSLPlaExploreProbWeightful = 0.0
humanSLOppExploreProbWeightless = 0.0
humanSLOppExploreProbWeightful = 0.0
humanSLCpuctExploration = 0.50
humanSLCpuctPermanent = 0.2

chosenMoveTemperatureEarly = 0.85
chosenMoveTemperature = 0.70
chosenMoveTemperatureHalflife = 80
chosenMoveTemperatureOnlyBelowProb = 0.01
rootNumSymmetriesToSample = 2
useLcbForSelection = false
staticScoreUtilityFactor = 0.30
dynamicScoreUtilityFactor = 0.00
useUncertainty = false
subtreeValueBiasFactor = 0.0
useNoisePruning = false
