[project]
name = "kyokugo-ai-gnn"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "numpy==2.5.4",
  "onnx==1.23.2",
  "onnxscript==0.7.2",
]

[project.optional-dependencies]
cuda = ["torch==2.14.1+cu130"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = false
